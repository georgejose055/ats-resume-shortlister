<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Resume Shortlister</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>ATS Resume Shortlister</h1>
    <form id="jdForm">
        <label for="jd">Paste Job Description (JD):</label><br>
        <textarea id="jd" name="jd" rows="10" cols="50" placeholder="Enter JD here..."></textarea><br><br>
        <button type="button" id="runBtn">Run Screening</button>
    </form>
    <div id="result"></div>
    <script src="script.js"></script>
</body>
</html>
